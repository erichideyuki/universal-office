[package]
name = "uofonts"
version = "0.1.0"
edition = "2024"
publish = false

# Spike: porta fiel de docx-layout/src/typography/font/{sfnt,gpos}.ts (o mesmo algoritmo e o
# mesmo resultado), sem dependências. lib = núcleo; cdylib = WebAssembly; bin = benchmark nativo.
[features]
default = ["count"]
count = []

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

# WebAssembly pequeno: cargo build --target wasm32-unknown-unknown --profile wasm
[profile.wasm]
inherits = "release"
opt-level = "s"
strip = true

[profile.wasm-fast]
inherits = "release"
strip = true

[[bin]]
name = "lines"
path = "src/bin/lines.rs"
