# Fuzz targets of the uo-opc container layer, uo-jsnum, uo-fonts, uo-drawingml (odraw included) and the schema-driven codec (rust-port workflow, stage 4 security).
# Its own workspace: not a member of core/ (cargo-fuzz needs nightly; core/ builds on stable).
#
#   cargo +nightly fuzz run <target> -s none          # libFuzzer (Linux CI, or Windows MSVC)
#   cargo run --release --no-default-features --features fallback --bin seed
#   cargo run --release --no-default-features --features fallback --bin fallback -- --secs 60
#
# The targets are plain `fn(&[u8])` in src/lib.rs; the fallback driver runs them on stable with
# a seeded mutation loop over the same corpus (see the module record, "Security (stage 4)").
[package]
name = "uo-opc-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[features]
default = ["libfuzzer"]
libfuzzer = ["dep:libfuzzer-sys"]
# the stable-Rust driver and the seed builder (no libFuzzer)
fallback = []

[dependencies]
uo-opc = { path = "../crates/uo-opc" }
uo-jsnum = { path = "../crates/uo-jsnum" }
# the numfmt_format target (src/numfmt.rs)
uo-numfmt = { path = "../crates/uo-numfmt" }
# the xlsx_write target (src/xlsx.rs)
uo-xlsx = { path = "../crates/uo-xlsx", features = ["read"] }
# the store_ops target (src/calc.rs): the Sheet cell store
uo-calc = { path = "../crates/uo-calc" }
# the dml_* targets (src/drawingml.rs)
uo-drawingml = { path = "../crates/uo-drawingml", features = ["legacy"] }
# the shipped hyphenation patterns (fonts_hyphen_words)
uo-fonts = { path = "../crates/uo-fonts", features = ["hyphen-data"] }
# the codec targets (src/codec.rs): the runtime and the generated decoders of the display list and of Write's page section
uo-codec = { path = "../crates/uo-codec" }
# the slides_* targets (src/slides.rs): the validating decoder and the encoder of the Slides display list
uo-render = { path = "../crates/uo-render" }
# the doc_convert target (src/doc.rs): the .doc converter; the read_docx target (src/docx.rs): the docx reader;
# odt_read, export_docx and compare_docx (src/d5.rs): ODF, the HTML/Markdown exporters and the document diff
uo-docx = { path = "../crates/uo-docx", features = ["doc", "odf", "export", "compare", "editing-api"] }
# the ffi_docx_to_pdf target (src/pipeline.rs): the whole server pipeline through the C ABI
uo-ffi = { path = "../crates/uo-ffi" }
# the image_decode target (src/image.rs)
uo-image = { path = "../crates/uo-image" }
# the pptx_open and dml_shapes targets (src/pptx.rs): the Slides read path
uo-pptx = { path = "../crates/uo-pptx", features = ["canon", "ppt", "edit"] }
uo-dml-render = { path = "../crates/uo-dml-render", features = ["canon"] }
# the chart_parse target (src/charts.rs): the chart model parser (the canon feature compares models with NaN fields)
uo-charts = { path = "../crates/uo-charts", features = ["canon"] }
# fonts built in code for the font targets and their seeds (no proprietary bytes)
uo-testkit = { path = "../crates/uo-testkit" }
# differential oracle of the inflate target (the same pinned version uo-opc uses to deflate)
miniz_oxide = { version = "=0.9.1", default-features = false, features = ["with-alloc"] }
libfuzzer-sys = { version = "0.4", optional = true }

[lib]
path = "src/lib.rs"
test = false
doc = false

[[bin]]
name = "seed"
path = "src/bin/seed.rs"
required-features = ["fallback"]
test = false
doc = false
bench = false

