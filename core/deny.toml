# cargo-deny configuration of the Rust core. Only the bans are enforced here (advisories run
# with cargo-audit in CI).
#
# libm and num-traits: their float functions (`Float::sin`, `libm::pow`, ...) are not the bits
# JavaScript computes, and a generic `T: Float` would bring std or libm math back past the
# clippy ban list (core/clippy.toml). Engine crates get their math from `uo-jsnum`. A
# transitive need must go through `wrappers` with the reason recorded in
# core/docs/modules/uo-jsnum.md.
[bans]
multiple-versions = "allow"
deny = [
    { name = "libm" },
    { name = "num-traits" },
]

# Licences: every crate linked into the shipped artifacts must be under one of these (an OR expression needs one
# alternative covered, an AND expression all its terms). tools/licenses/gen-notices.mjs reads the same list to build
# core/licenses (the third-party notices that ship with the npm packages and the NuGet).
[licenses]
allow = ["MIT", "Apache-2.0", "BSD-3-Clause"]
confidence-threshold = 0.8

[licenses.private]
ignore = false
