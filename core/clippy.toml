allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true

# Workspace ban list (uo-jsnum plan, G6): the f64 methods that are not what JavaScript computes live in uo_jsnum;
# a test, bench or example that needs one writes #[expect(clippy::disallowed_methods, reason = "...")].
# core/tests/clippy-ban/check.sh asserts every path below resolves (an unresolvable path is silently ignored).
disallowed-methods = [
    { path = "f64::sin", reason = "uo_jsnum::math::sin" },
    { path = "f64::cos", reason = "uo_jsnum::math::cos" },
    { path = "f64::tan", reason = "uo_jsnum::math::tan" },
    { path = "f64::sin_cos", reason = "uo_jsnum::math::sin and cos" },
    { path = "f64::asin", reason = "uo_jsnum::math::asin" },
    { path = "f64::acos", reason = "uo_jsnum::math::acos" },
    { path = "f64::atan", reason = "uo_jsnum::math::atan" },
    { path = "f64::atan2", reason = "uo_jsnum::math::atan2" },
    { path = "f64::sinh", reason = "uo_jsnum::math::sinh" },
    { path = "f64::cosh", reason = "uo_jsnum::math::cosh" },
    { path = "f64::tanh", reason = "uo_jsnum::math::tanh" },
    { path = "f64::asinh", reason = "no Math.asinh in use: add it to uo_jsnum::math first" },
    { path = "f64::acosh", reason = "no Math.acosh in use: add it to uo_jsnum::math first" },
    { path = "f64::atanh", reason = "uo_jsnum::math::atanh" },
    { path = "f64::exp", reason = "uo_jsnum::math::exp" },
    { path = "f64::exp2", reason = "uo_jsnum::math::pow(2, x)" },
    { path = "f64::exp_m1", reason = "uo_jsnum::math::expm1" },
    { path = "f64::ln", reason = "uo_jsnum::math::log (Math.log is the natural logarithm)" },
    { path = "f64::log", reason = "" },
    { path = "f64::log2", reason = "uo_jsnum::math::log2" },
    { path = "f64::log10", reason = "uo_jsnum::math::log10" },
    { path = "f64::ln_1p", reason = "uo_jsnum::math::log1p" },
    { path = "f64::cbrt", reason = "uo_jsnum::math::cbrt" },
    { path = "f64::hypot", reason = "uo_jsnum::math::hypot, hypot3 or hypot_n" },
    { path = "f64::powf", reason = "uo_jsnum::math::pow" },
    { path = "f64::powi", reason = "uo_jsnum::math::pow (LLVM powi is repeated multiplication, not Math.pow)" },
    { path = "f64::mul_add", reason = "separate * and + (a fused multiply-add rounds once; JS never fuses)" },
    { path = "f64::round", reason = "uo_jsnum::math::round (half towards +infinity; f64::round is half away from zero)" },
    { path = "f64::round_ties_even", reason = "uo_jsnum::conv::to_uint8_clamp or uo_jsnum::math::round (JS has no round half to even on numbers)" },
    { path = "f64::max", reason = "uo_jsnum::math::max (NaN wins, +0 > -0; f64::max ignores NaN)" },
    { path = "f64::min", reason = "uo_jsnum::math::min (NaN wins, -0 < +0; f64::min ignores NaN)" },
    { path = "f64::clamp", reason = "uo_jsnum::math::min and max (f64::clamp panics on NaN bounds)" },
    { path = "f64::signum", reason = "uo_jsnum::math::sign (signum(+-0) is +-1)" },
    { path = "f64::rem_euclid", reason = "uo_jsnum::math::rem (JS % keeps the sign of the dividend)" },
    { path = "f64::div_euclid", reason = "floor of a division (uo_jsnum::math::floor)" },
    { path = "f64::abs_sub", reason = "max(a - b, 0) written out" },
    { path = "f64::to_degrees", reason = "x * 180 / PI as the TS writes it (to_degrees multiplies by one rounded constant: 255,004 of 1M results differ)" },
    { path = "f64::to_radians", reason = "x * PI / 180 as the TS writes it (to_radians multiplies by one rounded constant)" },
    { path = "f64::midpoint", reason = "(a + b) / 2 as the TS writes it" },
    { path = "f32::sin", reason = "uo_jsnum::math::sin" },
    { path = "f32::cos", reason = "uo_jsnum::math::cos" },
