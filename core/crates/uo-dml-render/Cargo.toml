[package]
name = "uo-dml-render"
description = "Shared DrawingML shape renderer of the UniversalOffice Rust core (Slides and Sheet drawings): the shape model and its reader, the theme with the PowerPoint HSL colour-modifier profile, the text-style cascade, table styles, text layout fed by advance tables, and the emission of shapes, pictures, tables, SmartArt and metafiles as a display list"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# the canonical JSON printer of the parity captures (`uo-pptx.md` "Parity"): tests and tools only
canon = ["dep:uo-testkit"]

[dependencies]
# JS numerics (parseInt, Math.*, String(n), sort): every result the TS computed with JS semantics
uo-jsnum = { path = "../uo-jsnum" }
# JS text semantics: \p{Ll}, toUpperCase, grapheme clusters (Intl.Segmenter) of the text layout
uo-text = { path = "../uo-text" }
# the parsed XML the reader walks and the theme keeps (fill/line/effect style lists are element ids into it)
uo-opc = { path = "../uo-opc" }
# the Slides display list the emitter fills (`uo_render::slides`: items, resources, the codec)
uo-render = { path = "../uo-render" }
# custom-geometry subpaths (`custGeom`), presets, colour modifiers and masks the emitter will call
uo-drawingml = { path = "../uo-drawingml" }
# the chart engine: `emit::chart` implements its host, canvas and measurement traits (frontier C-6)
uo-charts = { path = "../uo-charts" }
# `FormatLocale` of the chart emit (pt-BR, the TS host passes none)
uo-numfmt = { path = "../uo-numfmt" }
# the measurement table's maps (the same pinned version as uo-fonts and uo-render)
rustc-hash = "=2.1.3"
# the Slides TIFF decoder of the metafile module (B5b: `rasterizeSpecialImage` of a TIFF)
uo-image = { path = "../uo-image" }
# the EOT reader (MicroType Express) the deck's font reader calls through `uo_dml_render::eot_to_sfnt` (B5b: `eot.ts`)
uo-fonts = { path = "../uo-fonts" }
# SHA-256 of the canonical JSON digests (feature `canon`)
uo-testkit = { path = "../uo-testkit", optional = true }

[dev-dependencies]
uo-alloc = { path = "../uo-alloc", features = ["global"] }
# the capture reader of the metafile tests
uo-testkit = { path = "../uo-testkit" }

[lints]
workspace = true
