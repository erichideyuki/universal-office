[package]
name = "uo-image"
description = "Raster image codecs of the UniversalOffice Rust core: header reads (JPEG, PNG, GIF, BMP) and decoders to RGBA (PNG, GIF, BMP, TIFF) for the PDF writer and the read path, with limits for untrusted input"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# JPEG to RGBA (`decode_jpeg`): only the PDF's colour effects on JPEG pictures need it (uo-pptx feature `pdf`); no wasm
# build enables it (the browser decodes JPEG itself)
jpeg = ["dep:zune-jpeg", "dep:zune-core"]

[dependencies]
# the JPEG decoder of feature `jpeg` (pinned; scalar path, single-threaded: docs/modules/uo-image.md "JPEG decoder")
zune-jpeg = { version = "=0.5.15", default-features = false, features = ["std"], optional = true }
zune-core = { version = "=0.5.3", default-features = false, features = ["std"], optional = true }
# zlib inflate (PNG IDAT, TIFF deflate strips): the port of fflate's `unzlibSync` the TS uses
uo-opc = { path = "../uo-opc" }
# every Math.* call and typed-array store of the TS goes through it
uo-jsnum = { path = "../uo-jsnum" }

[dev-dependencies]
uo-alloc = { path = "../uo-alloc", features = ["global"] }
# parity capture/replay: tests/image_parity.rs
uo-testkit = { path = "../uo-testkit" }

[lints]
workspace = true
