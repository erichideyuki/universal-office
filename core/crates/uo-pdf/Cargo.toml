[package]
name = "uo-pdf"
description = "PDF writer of the UniversalOffice Rust core: objects, streams, xref, fonts (Type0/Identity-H with ToUnicode), images, shadings, links and outlines, streamed to a sink"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# the XPS writer of the display list (src/xps.rs; milestone 2, wave 7, A1, D-A1-2): the Write editor module's File > Save as XPS
xps = []

[dependencies]
# fmt(), parseInt, trim, Math.round/min/max/cos/sin: every number and string rule of the TS (record PQ5, "Numbers")
uo-jsnum = { path = "../uo-jsnum" }
# the reusable zlib compressor (PQ5) and the inflate of the structural comparison in the tests
uo-opc = { path = "../uo-opc" }
# TrueType subsetting for the embedded fonts
uo-fonts = { path = "../uo-fonts" }
# the display list the painter reads (pages, resources, navigation) and the geometry/fill/effect helpers it shares with the canvas painter
uo-render = { path = "../uo-render" }
# PNG/GIF/BMP/TIFF decoders and the JPEG header read (the images of the pages)
uo-image = { path = "../uo-image" }
# the mask operations of the picture and shape effects, the blip colour effects
uo-drawingml = { path = "../uo-drawingml" }
# the font and alpha-state maps (the same pinned version as uo-fonts)
rustc-hash = "=2.1.3"

[dev-dependencies]
uo-alloc = { path = "../uo-alloc", features = ["global"] }
# parity capture/replay and the seeded generators: tests/writer_parity.rs
uo-testkit = { path = "../uo-testkit" }

[lints]
workspace = true
