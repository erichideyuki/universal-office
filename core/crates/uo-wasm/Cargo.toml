[package]
name = "uo-wasm"
description = "WebAssembly exports of the UniversalOffice Rust core, consumed by the JS products"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# memory counters exposed to the JS tests (M2/M4); never in the shipped module
count = ["dep:uo-alloc", "uo-alloc/global"]
# test-only export of the uo-opc round trip for the wasm memory gate (M2 of uo-opc,
# tests/opc_memory.test.mjs); not the binding API, never in the shipped module
opc-memtest = ["dep:uo-opc"]
# bench-only exports of the uo-opc benchmark (stage 5, tools/bench/opc/wasm.mjs); never shipped
opc-bench = ["opc-memtest", "count"]
# test-only exports of the uo-jsnum wasm memory gate (stage 4, tests/jsnum_memory.test.mjs); never shipped
jsnum-memtest = ["dep:uo-jsnum", "count"]
# test-only export of the uo-jsnum parity self-test (stage 4, tests/jsnum_selftest.test.mjs): recomputes the
# digests of the committed captures inside the module; never shipped
jsnum-selftest = ["dep:uo-jsnum", "dep:uo-testkit"]

# test-only exports of the uo-fonts wasm memory gate (stage 4, tests/fonts_memory.test.mjs): the soaks of the
# native test over buffers JS moves in, and the worst-case fonts; never shipped
fonts-memtest = ["dep:uo-fonts", "dep:uo-testkit", "count"]

# test-only exports of the uo-fonts parity self-test (stage 4, tests/fonts_selftest.test.mjs): recomputes the
# facets of the committed captures inside the module; never shipped
fonts-selftest = ["dep:uo-fonts", "dep:uo-testkit"]

# test-only exports of the uo-drawingml wasm memory gate (tests/dml_memory.test.mjs): the soak of the module
# record, the big effects with their peak bytes, the wasm32 limit rows; never shipped
dml-memtest = ["dep:uo-drawingml", "count"]

# test-only exports of the uo-drawingml parity self-test (tests/dml_selftest.test.mjs): replays the committed
# captures inside the module (the replay functions of the native parity tests, included with #[path]); never shipped
dml-selftest = ["dep:uo-drawingml", "dep:uo-jsnum", "dep:uo-testkit"]

# the canvas paint exports of uo-render (frontier E): the view handle, the page encoder and the
# item-addressed paint operations (src/render.rs). The shipped module enables it with the layout
render = ["buf", "dep:uo-render", "dep:uo-codec", "dep:uo-drawingml", "dep:uo-jsnum", "dep:uo-fonts"]

# the Write read path for the browser (milestone 1, src/write.rs): open, layout with the viewer font policy, pages for
# the canvas, navigation and run boxes, the PDF in chunks to the host import uo_host.pdf_chunk. The module of the
# viewer: render + write (uo-bindings.md). uo-image (wave 7, F2): `uo_layout_image_rgba`, the editor's fallback decode
write = ["render", "dep:uo-opc", "dep:uo-docx", "dep:uo-docx-layout", "dep:uo-pdf", "dep:uo-image"]

# the Write editing session for the browser (milestone 2, src/session.rs; record uo-bindings.md "Milestone 2: the
# session in wasm"): one `UoWriteSession` handle over uo-docx's `Session` and the layout's `LayoutOracle`, the hot
# paths, `exec`/`query`/`complete` through the schema-generated codec (schema/session.uos), layouts, caret and
# hit tests, the font save in two phases. The editor's module: write + session (the viewer module stays as it is)
# wave 7 (A1, decision D-A1-4): the ODF reader/writer and the HTML/Markdown exporters of uo-docx in the editor module;
# (A1, D-A1-3) the document comparison of uo-docx (`compare`, the Rust `diffDocuments` of File > Compare); (A1, D-A1-2, fix
# round 2) the XPS writer of uo-pdf (`xps`: File > Save as XPS from the session's display list)
session = ["write", "uo-docx/session", "uo-docx-layout/oracle", "dep:indexmap", "uo-docx/odf", "uo-docx/export", "uo-docx/compare", "uo-pdf/xps"]

# test-only exports of the session (tests/session_*.test.mjs): the capture replay of the D2a/D2b families inside the
# module (the native parity tests' support modules, included with #[path]), the facets, random messages; never shipped
# (`uo-docx/export`: the F8 replay's `cbw` facet compares the HTML a copy writes, which the uo-docx export feature gates, F8-D5;
# the shipped `session` feature does not have it)
session-selftest = ["session", "count", "uo-docx/canon", "uo-docx/export", "dep:uo-testkit"]

# test-only fixture views for the render exports (tests/render_paint.test.mjs, tests/render_boundary.test.mjs): a text
# page with effects, a pattern, the rectangular gradient, blip tiles, a picture look and page fills built inside
# the module from an open font; never shipped
render-fixture = ["render", "count"]

# the result buffer (`UoBuf`) and its four exports, shared by the render and Slides modules (src/buf.rs)
buf = []

# the Slides viewer module `uo-slides.wasm` (frontier B7, src/slides.rs): the deck, the two-phase measurement loop, the
# emission of the Slides display list, the click show and the playback timeline. No paint exports of the Write
# painter, no layout of the Write engine
slides = ["buf", "dep:uo-pptx", "dep:uo-dml-render", "dep:uo-render"]

# the `.ppt` converter as its own lazily loaded module `uo-slides-ppt.wasm` (src/slides_ppt.rs): bytes of a `.ppt` in,
# the bytes of the equivalent `.pptx` out
slides-ppt = ["buf", "dep:uo-pptx", "uo-pptx/ppt"]

# test-only exports of the Slides module (tests/slides_*.test.mjs): the memory counters and a trap; never shipped
# (the `count` feature does both: this name is for the CI line)

[dependencies]
uo-render = { path = "../uo-render", optional = true }
uo-codec = { path = "../uo-codec", optional = true }
uo-alloc = { path = "../uo-alloc", optional = true }
uo-opc = { path = "../uo-opc", optional = true }
uo-fonts = { path = "../uo-fonts", optional = true }
uo-drawingml = { path = "../uo-drawingml", optional = true }
uo-jsnum = { path = "../uo-jsnum", optional = true }
uo-testkit = { path = "../uo-testkit", optional = true }
uo-docx = { path = "../uo-docx", optional = true }
# the layout without its oracle (the LayoutOracle is the editor's, milestone 2)
uo-docx-layout = { path = "../uo-docx-layout", optional = true, default-features = false }
uo-pdf = { path = "../uo-pdf", optional = true }
uo-image = { path = "../uo-image", optional = true }
uo-pptx = { path = "../uo-pptx", optional = true }
uo-dml-render = { path = "../uo-dml-render", optional = true }
# the maps of the session's wire conversions (uo-docx's JsMap is an IndexMap; same version)
indexmap = { version = "2", optional = true }

[lints]
workspace = true

[dev-dependencies]
# the session tests (tests/session_native.rs): the corpus, the capture tools, the canonical digests and the hostile
# command generators of uo-docx's own tests (included with #[path])
uo-testkit = { path = "../uo-testkit" }
uo-docx = { path = "../uo-docx", features = ["canon", "session"] }
uo-opc = { path = "../uo-opc" }
uo-jsnum = { path = "../uo-jsnum" }
uo-drawingml = { path = "../uo-drawingml" }
