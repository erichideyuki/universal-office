[package]
name = "uo-wasm"
description = "WebAssembly exports of the UniversalOffice Rust core, consumed by the JS products"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# memory counters exposed to the JS tests (M2/M4); never in the shipped module
count = ["dep:uo-alloc", "uo-alloc/global"]

[dependencies]
uo-alloc = { path = "../uo-alloc", optional = true }

[lints]
workspace = true
