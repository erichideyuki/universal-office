[package]
name = "uo-wasm"
description = "WebAssembly exports of the UniversalOffice Rust core, consumed by the JS products"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# memory counters exposed to the JS tests (M2/M4); never in the shipped module
count = ["dep:uo-alloc", "uo-alloc/global"]
# test-only export of the uo-opc round trip for the wasm memory gate (M2 of uo-opc,
# tests/opc_memory.test.mjs); not the binding API, never in the shipped module
opc-memtest = ["dep:uo-opc"]
# bench-only exports of the uo-opc benchmark (stage 5, tools/bench/opc/wasm.mjs); never shipped
opc-bench = ["opc-memtest", "count"]
# test-only exports of the uo-jsnum wasm memory gate (stage 4, tests/jsnum_memory.test.mjs); never shipped
jsnum-memtest = ["dep:uo-jsnum", "count"]
# test-only export of the uo-jsnum parity self-test (stage 4, tests/jsnum_selftest.test.mjs): recomputes the
# digests of the committed captures inside the module; never shipped
jsnum-selftest = ["dep:uo-jsnum", "dep:uo-testkit"]

# test-only exports of the uo-fonts wasm memory gate (stage 4, tests/fonts_memory.test.mjs): the soaks of the
# native test over buffers JS moves in, and the worst-case fonts; never shipped
fonts-memtest = ["dep:uo-fonts", "dep:uo-testkit", "count"]

# test-only exports of the uo-fonts parity self-test (stage 4, tests/fonts_selftest.test.mjs): recomputes the
# facets of the committed captures inside the module; never shipped
fonts-selftest = ["dep:uo-fonts", "dep:uo-testkit"]

# test-only exports of the uo-drawingml wasm memory gate (tests/dml_memory.test.mjs): the soak of the module
# record, the big effects with their peak bytes, the wasm32 limit rows; never shipped
dml-memtest = ["dep:uo-drawingml", "count"]

# test-only exports of the uo-drawingml parity self-test (tests/dml_selftest.test.mjs): replays the committed
# captures inside the module (the replay functions of the native parity tests, included with #[path]); never shipped
dml-selftest = ["dep:uo-drawingml", "dep:uo-jsnum", "dep:uo-testkit"]

[dependencies]
uo-alloc = { path = "../uo-alloc", optional = true }
uo-opc = { path = "../uo-opc", optional = true }
uo-fonts = { path = "../uo-fonts", optional = true }
uo-drawingml = { path = "../uo-drawingml", optional = true }
uo-jsnum = { path = "../uo-jsnum", optional = true }
uo-testkit = { path = "../uo-testkit", optional = true }

[lints]
workspace = true
