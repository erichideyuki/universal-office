[package]
name = "uo-jsnum"
description = "JavaScript numerics of the UniversalOffice Rust core: Math.* as V8 13.6 computes them (fdlibm), ToInt32 and typed-array conversions, the JS whitespace set, Number() and parseInt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT AND BSD-3-Clause"
repository.workspace = true
publish.workspace = true

[dependencies]
# Number::toString (shortest round-trip digits): byte-identical to V8's `String(x)` on 3M values (record G4/S6).
# Pinned: a new version would be a new parity claim.
ryu-js = { version = "=1.0.3", default-features = false }

[dev-dependencies]
uo-alloc = { path = "../uo-alloc", features = ["global"] }
# parity capture/replay: tests/differential.rs
uo-testkit = { path = "../uo-testkit" }

[lints]
workspace = true
