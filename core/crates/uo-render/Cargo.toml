[package]
name = "uo-render"
description = "Display list of the UniversalOffice Rust core: the item vocabulary shared by every producer (Write layout, later Slides and Sheet) and every painter (the TS canvas, uo-pdf), its per-page encoding and the painter helpers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# every Math.* of the moved painter helpers (geom, paint) and the NaN canonicalization of OptF64
uo-jsnum = { path = "../uo-jsnum" }
# FaceRes holds the parsed face shared with the registry
uo-fonts = { path = "../uo-fonts" }
# ImageRes.effects is the blip effect set of uo-drawingml (InlineImage.effects)
uo-drawingml = { path = "../uo-drawingml" }
# the runtime of the generated codec (src/codec, frontier C)
uo-codec = { path = "../uo-codec" }
# the symbol table's lookup (order is not observable there: ids are dense in first-use order)
rustc-hash = "=2.1.3"

[dev-dependencies]
uo-alloc = { path = "../uo-alloc", features = ["global"] }
# the parity replay of the painter helpers (tests/g_*.rs)
uo-testkit = { path = "../uo-testkit" }

[lints]
workspace = true
