[package]
name = "uo-docx-layout"
description = "Write layout engine of the UniversalOffice Rust core: pages, sections, columns, lines, tables, floats, textboxes, notes, headers and footers, fields, and the display list of a Word document"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# TS Map/Set insertion order (the pass state and the outputs that the TS keeps in Maps; plan §4)
indexmap = "2"
# keyed caches whose order is not observable (plan §4: the spike-1 lesson)
rustc-hash = "=2.1.3"
# every Math.*, Number(), parseInt, String(n) and float -> int conversion of the TS (LA1.3)
uo-jsnum = { path = "../uo-jsnum" }
# faces, kerning, ligatures, hyphenation patterns (and the registry of frontier P, LQ8)
uo-fonts = { path = "../uo-fonts" }
# presets, colour modifiers, blip effects, masks (used as is)
uo-drawingml = { path = "../uo-drawingml" }
# the runtime of the generated codec (src/codec, frontier C)
uo-codec = { path = "../uo-codec" }
# the display list this crate produces (items, resources, navigation)
uo-render = { path = "../uo-render" }
# the model, read through DocView (A4), with the ids, RunRef, CellKey and the `word` semantics of
# LQ3; src/model.rs is the only module that names it
uo-docx = { path = "../uo-docx" }

[dev-dependencies]
uo-alloc = { path = "../uo-alloc", features = ["global"] }
# capture files, canonical streams (the P1 replay and the F0 adapter check)
uo-testkit = { path = "../uo-testkit" }

[lints]
workspace = true
