[package]
name = "uo-docx"
description = "Write document engine of the UniversalOffice Rust core: the document model, the docx reader (milestone 1), and later the lossless writer, the editing session, the Editing API, .doc and the exporters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# the integration tests are one binary (tests/all.rs), not one per file
autotests = false
publish.workspace = true

# G1 (milestone-1 gate): one crate, modules behind features. The read path (model, reader,
# formatting, the layout-facing view) is always built; the rest is opt-in per host.
[features]
default = []
# the canonical model digest (A6) and the JSON keys with the JS rules (LQ20): parity tooling and
# uo-docx-layout's JSON keys; tests turn it on
canon = []
# the editing session and history (D2a/D2b, milestone 2); the table sort borrows Sheet's word-sort
# collation (D2b-F3)
session = ["uo-text/collation"]
# the Editing API for .NET hosts (D3)
editing-api = []
# .doc conversion (D4); the OfficeArt layer (odraw) is uo-drawingml's feature `legacy`
doc = ["uo-drawingml/legacy"]
# ODF read/write (D5)
odf = []
# HTML/Markdown export (D5)
export = []
# document comparison (D5)
compare = []

[dependencies]
# TS Map/Set insertion order (ordered maps of the model, plan "Crate vs own port")
indexmap = "2"
uo-drawingml = { path = "../uo-drawingml" }
uo-fonts = { path = "../uo-fonts" }
uo-jsnum = { path = "../uo-jsnum" }
uo-opc = { path = "../uo-opc" }
# UTF-16 case mapping with SpecialCasing and JS white space over units (the Word semantics of
# `word`, LQ11/K10: toUpperCase/toLowerCase, trim, white space runs)
uo-text = { path = "../uo-text" }

[[test]]
name = "all"
path = "tests/all.rs"

[dev-dependencies]
uo-alloc = { path = "../uo-alloc", features = ["global"] }
uo-testkit = { path = "../uo-testkit" }
# the tests build with the canonical digest
uo-docx = { path = ".", features = ["canon"] }

[lints]
workspace = true

# the wasm32 stack probe of nested stories (G20, record "Nested-story stack — fixed"):
#   cargo build -p uo-docx --example nested_stack_wasm --target wasm32-unknown-unknown --profile wasm
#   node core/crates/uo-docx/js/wasm-stack.mjs <target>/wasm32-unknown-unknown/wasm/examples/nested_stack_wasm.wasm
[[example]]
name = "nested_stack_wasm"
crate-type = ["cdylib"]
