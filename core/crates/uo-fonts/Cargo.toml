[package]
name = "uo-fonts"
description = "Font layer of the UniversalOffice Rust core: sfnt files, cmap, metrics, OpenType kerning and ligatures, outlines, subsetting, embedding, hyphenation patterns"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# embeds the hyphenation pattern files of data/hyphen for native and .NET builds (never in the wasm)
hyphen-data = []

[dependencies]
# the hash of the glyph-pair maps (gate 1): the v2 rotation keeps `g1 * 65536 + g2` keys from piling into one bucket
rustc-hash = "=2.1.3"
# the JS semantics of the TS (whitespace, trim, toLowerCase, the lowerCp rule, parseInt over code units, ToUint8):
# one implementation, replayed against V8 there (stage 5, uo-jsnum D2; the private `js` module moved there)
uo-jsnum = { path = "../uo-jsnum" }

[dev-dependencies]
uo-alloc = { path = "../uo-alloc", features = ["global"] }
# test fonts built in code (generate::sfnt), never proprietary files
uo-testkit = { path = "../uo-testkit" }
# the fonts embedded in committed documents, extracted in memory by the stage-4 parity corpus
uo-opc = { path = "../uo-opc" }

[lints]
workspace = true
