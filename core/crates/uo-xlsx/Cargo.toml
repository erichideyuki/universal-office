[package]
name = "uo-xlsx"
description = "xlsx writer of the UniversalOffice Rust core (Sheet track C, writing side): streamed rows, shared strings, deduplicated styles, outline, frozen panes, defined names, core properties"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# zip (streamed entries), raw deflate, the XML escapes
uo-opc = { path = "../uo-opc" }
# the built-in number formats (a custom code equal to an invariant built-in is written as its id)
uo-numfmt = { path = "../uo-numfmt" }
# Number -> string as JS prints it (the <v> of numeric cells)
uo-jsnum = { path = "../uo-jsnum" }
# track C (reader, surgical save, grid, editor): the one cell store and the calc. Optional, so the writer's
# consumers (`grid-xlsx`, pinned by git rev) build exactly what they built before.
uo-calc = { path = "../uo-calc", optional = true }
# feature `grid`: NFKC of font names, toUpperCase/toLowerCase, the Unicode letter classes of the entry
uo-text = { path = "../uo-text", optional = true, features = ["collation"] }
# feature `xls` (C2): the OfficeArt records/properties/BLIP store/preset table of the Office 97-2003 drawings
uo-drawingml = { path = "../uo-drawingml", optional = true, features = ["legacy"] }
# feature `view` (C4): the Slides display list the viewport is emitted in
uo-render = { path = "../uo-render", optional = true }
rustc-hash = { version = "=2.1.3", optional = true }
# feature `save` (C1b): the JS regular expressions of the text surgery (`save-calc.ts`, the XfPool patch, `updateWorksheetXml`)
# run on the same engine uo-calc uses (the vendored `regress`, ECMAScript syntax): matching is the TS's by construction
regress = { path = "../../vendor/regress", optional = true, default-features = false, features = ["std", "utf16", "prohibit-unsafe"] }
# feature `facet`: the digest of long strings in the canonical JSON
uo-testkit = { path = "../uo-testkit", optional = true }

# Architecture pass 2026-11-24 (record uo-xlsx.md "Track C architecture"). The default (no feature) is the
# from-scratch writer, unchanged.
[features]
# workbook model + streaming reader into the uo-calc store (C1a)
read = ["dep:uo-calc"]
# the canonical JSON of the model (parity harnesses, tests): C1a facets
facet = ["read", "uo-calc/facet", "dep:uo-testkit"]
# surgical save of an opened workbook: sheetData from the store, save-calc, the XfPool styles patch (C1b)
save = ["read", "dep:uo-text", "dep:regress"]
# .xls (BIFF8) -> in-memory OOXML parts, the TS xls/ converter (C2); a separate lazily loaded wasm
xls = ["read", "dep:uo-drawingml"]
# grid model and the viewport display list (C3, C4)
grid = ["read", "dep:uo-text"]
# the viewport display list of the Sheet viewer (C4): the Slides canvas-IR list with the two Sheet items
view = ["grid", "dep:uo-render", "dep:rustc-hash"]
# editor session: operations, change-set undo, save (C5)
edit = ["grid", "save"]

[dev-dependencies]
uo-alloc = { path = "../uo-alloc", features = ["global"] }
# the C1a parity replay
uo-testkit = { path = "../uo-testkit" }

# the C1a open benchmark needs the reader
[[example]]
name = "read_bench"
required-features = ["read"]

# the C2 converter tools: `xls_dump` writes the parts of a .xls (diff against js/dump-xls-parts.mjs), `xls_bench` the T13 row
[[example]]
name = "xls_dump"
required-features = ["xls"]

[[example]]
name = "xls_bench"
required-features = ["xls"]

[lints]
workspace = true

# the C3a grid benchmark needs the grid model
[[example]]
name = "grid_bench"
required-features = ["grid"]

# the C3b conditional-format benchmark needs the grid model
[[example]]
name = "cf_bench"
required-features = ["grid"]

# the C3c paint benchmark needs the grid model
[[example]]
name = "paint_bench"
required-features = ["grid"]

# the C1b save benchmark needs the surgical save
[[example]]
name = "save_bench"
required-features = ["save"]

# the C4 benchmark (open -> first list, 1080p emission, bytes allocated per frame)
[[example]]
name = "view_bench"
required-features = ["view"]
