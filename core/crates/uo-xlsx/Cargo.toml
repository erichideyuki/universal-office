[package]
name = "uo-xlsx"
description = "xlsx writer of the UniversalOffice Rust core (Sheet track C, writing side): streamed rows, shared strings, deduplicated styles, outline, frozen panes, defined names, core properties"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# zip (streamed entries), raw deflate, the XML escapes
uo-opc = { path = "../uo-opc" }
# the built-in number formats (a custom code equal to an invariant built-in is written as its id)
uo-numfmt = { path = "../uo-numfmt" }
# Number -> string as JS prints it (the <v> of numeric cells)
uo-jsnum = { path = "../uo-jsnum" }
# track C (reader, surgical save, grid, editor): the one cell store and the calc. Optional, so the writer's
# consumers (`grid-xlsx`, pinned by git rev) build exactly what they built before.
uo-calc = { path = "../uo-calc", optional = true }

# Architecture pass 2026-11-24 (record uo-xlsx.md "Track C architecture"). The default (no feature) is the
# from-scratch writer, unchanged.
[features]
# workbook model + streaming reader into the uo-calc store (C1a)
read = ["dep:uo-calc"]
# surgical save of an opened workbook: sheetData from the store, save-calc, the XfPool styles patch (C1b)
save = ["read"]
# .xls (BIFF8) -> in-memory OOXML parts, the TS xls/ converter (C2); a separate lazily loaded wasm
xls = ["read"]
# grid model and the viewport display list (C3, C4)
grid = ["read"]
# editor session: operations, change-set undo, save (C5)
edit = ["grid", "save"]

[dev-dependencies]
uo-alloc = { path = "../uo-alloc", features = ["global"] }

[lints]
workspace = true
