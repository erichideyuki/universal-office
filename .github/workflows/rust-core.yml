name: Rust core

# The Rust core of 0.10 (core/, branch rust-core) — the rust-port workflow's automatic
# checks: format and clippy, tests on the three OSes, the memory gate (M1-M3 in the crates'
# tests, the M2 soaks, M4 at the wasm and .NET boundaries, M6 with Miri and LeakSanitizer) and
# the wasm build (with the memory tests and the parity self-tests of uo-fonts and uo-drawingml in
# Node and WebKit), the viewer and editor switches (engine="rust": vitest, tsc, the package build and its
# smoke test, the Chromium harnesses; the editor's three front harnesses only off push), the fuzz targets (security, stage 4: core/fuzz) and the advisories of the
# dependencies. Opt-in tests (TS and .NET parity) print a SKIPPED line here. See
# .claude/skills/rust-port/SKILL.md.

on:
  push:
    branches: [rust-core]
  pull_request:
    paths: ['core/**', 'write/packages/editor/**', 'write/packages/viewer/**', 'tools/build-pkg.mjs', '.github/workflows/rust-core.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-core-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: core
    shell: bash

jobs:
  lint:
    name: Format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal -c clippy,rustfmt -t wasm32-unknown-unknown && rustup default stable
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo clippy --workspace --all-targets --all-features --target wasm32-unknown-unknown -- -D warnings
      # the workspace ban list (clippy.toml, uo-jsnum plan "Enforcement"): every path must resolve
      # (clippy ignores an unresolvable one silently), float -> int casts go through uo_jsnum::conv,
      # and the bans clippy cannot express
      - run: bash tests/clippy-ban/check.sh
      - run: bash tests/float-casts.sh
      - run: bash tests/grep-bans.sh

  codec:
    name: Schema-driven codec (regeneration check, Rust and TypeScript round trips)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: rustup toolchain install stable --profile minimal -t wasm32-unknown-unknown && rustup default stable
      # core/schema/*.uos -> the committed generated Rust and TypeScript (core/schema/manifest.txt): a schema edit
      # without `cargo run -p uo-schema -- generate` fails here
      - run: cargo run -p uo-schema --release -- check
      # R-P2: Rust encode -> Rust decode, Rust encode -> TypeScript decode -> TypeScript encode = identical bytes,
      # on the fixture schema and on render.uos and write.uos; the runtime tests of both languages; M1/M2/M3 of the
      # codec. UO_REQUIRE_NODE makes a missing Node a failure instead of a SKIPPED line.
      - run: cargo test -p uo-codec -p uo-schema --all-features
        env:
          UO_REQUIRE_NODE: '1'
      # the generated TypeScript type-checks under the strictest flags (the shell's tsconfig is a superset)
      - run: |
          npm install --prefix "$RUNNER_TEMP/ts" --no-save --no-package-lock typescript@5.9.3
          "$RUNNER_TEMP/ts/node_modules/.bin/tsc" --noEmit --strict --target es2022 --module esnext --moduleResolution bundler \
            --allowImportingTsExtensions --noUncheckedIndexedAccess --noUnusedLocals --noUnusedParameters --noImplicitReturns \
            --exactOptionalPropertyTypes --erasableSyntaxOnly --verbatimModuleSyntax --skipLibCheck \
            crates/uo-codec/js/runtime.ts crates/uo-wasm/js/gen/*.ts tools/uo-schema/tests/fixtures/*.ts \
            crates/uo-wasm/js/paint.ts crates/uo-wasm/js/picture.ts crates/uo-wasm/js/viewer.ts crates/uo-wasm/js/viewer.check.ts \
            crates/uo-wasm/js/editor.check.ts ../write/packages/viewer/src/write-engine.d.ts ../write/packages/editor/src/write-session.d.ts \
            crates/uo-wasm/js/session.d.ts crates/uo-wasm/js/session-stories.d.ts ../write/packages/editor/src/write-session-stories.d.ts \
            ../write/packages/editor/src/write-session-objects.d.ts \
            crates/uo-wasm/js/paint-slides.ts crates/uo-wasm/js/slides-effects.ts crates/uo-wasm/js/slides-warp.ts \
            crates/uo-wasm/js/slides-reveal.ts
      # the Slides painter and the draw-op recorder (R-S3/R-S4) against hand-built display lists
      - run: node --test crates/uo-pptx/js/selftest-drawops.mjs
      # the runtime builds for the browser (the generated codec is compiled for wasm32 by the lint job's clippy)
      - run: cargo build -p uo-codec --target wasm32-unknown-unknown --profile wasm

  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      # --all-features turns the counting allocator on: the memory tests (M1-M3) run here. uo-docx's integration tests are the
      # single `all` binary (tests/all.rs), so this line covers them (no per-file --test line); it also runs the G4 tests
      # (uo-docx-layout g4_cancel with the debug bound, uo-ffi cancel_layout) and the native halves of render_native/write_native
      - run: cargo test --workspace --all-features

  layout-parity:
    name: Layout parity (uo-docx-layout, same-run TS capture over generated documents)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # the frozen TS engine (main, 0.9.x) is the parity reference: built in the same run (LQ21)
      - uses: actions/checkout@v7
        with:
          # pinned to the frozen TS commit (the parity reference): main moves on and its dist was stale (F2-20)
          ref: d0f45bc54c05fb026475d7b229efa498af8423c6
          path: ts-main
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Build the frozen TS engine
        working-directory: ts-main
        run: |
          npm run install:converter
          npm run install:fonts
          npm run install:drawingml
          npm install --prefix write
          npm run build -w @universal-office/docx-core --prefix write
          npm run build -w @universal-office/docx-layout --prefix write
      # 200 generated documents with open fonts only (the Word oracle needs Office fonts: local
      # gate run), P1 + P2 + P3 captured with the raw streams; the adapter check decodes every TS
      # layout into the Rust types and must write the same canonical stream; the replay reports
      # how far the port reaches (pending per frontier) until the engine is complete
      - run: node crates/uo-docx-layout/tools/capture-layout.mjs --ts-root ../ts-main --mode ci --count 200 --seed ${{ github.run_number }} --out "$RUNNER_TEMP/layout/ci.capture" --dump "$RUNNER_TEMP/layout/dump" --docs-out "$RUNNER_TEMP/layout/docs"
      - run: cargo test --release -p uo-docx-layout --test adapter -- --nocapture
        env:
          UO_LAYOUT_CAPTURE: ${{ runner.temp }}/layout/ci.capture
          UO_LAYOUT_DUMP: ${{ runner.temp }}/layout/dump
      - run: cargo test --release -p uo-docx-layout --test layout_parity -- --nocapture
        env:
          UO_LAYOUT_PARITY: "1"
          UO_LAYOUT_CAPTURE: ${{ runner.temp }}/layout/ci.capture
          UO_LAYOUT_DUMP: ${{ runner.temp }}/layout/dump
          UO_LAYOUT_DOCS: ${{ runner.temp }}/layout/docs
      # F7a (engine core): documents of the content F7a lays out end to end (tools/lib/gen-f7a.mjs),
      # captured in the same run and replayed through the real engine; strict: none may be pending
      - run: node --max-old-space-size=8192 crates/uo-docx-layout/tools/capture-layout.mjs --ts-root ../ts-main --mode ci --gen f7a --count 300 --seed ${{ github.run_number }} --out "$RUNNER_TEMP/layout/f7a.capture" --dump "$RUNNER_TEMP/layout/f7a-dump" --docs-out "$RUNNER_TEMP/layout/f7a-docs"
      - run: cargo test --release -p uo-docx-layout --test layout_parity -- --nocapture
        env:
          UO_LAYOUT_PARITY: "1"
          UO_LAYOUT_STRICT: "1"
          UO_LAYOUT_CAPTURE: ${{ runner.temp }}/layout/f7a.capture
          UO_LAYOUT_DUMP: ${{ runner.temp }}/layout/f7a-dump
          UO_LAYOUT_DOCS: ${{ runner.temp }}/layout/f7a-docs
      # F7c (notes, headers/footers, fields): headers/footers, footnotes, endnotes and the
      # SEQ/REF/PAGEREF/NOTEREF/STYLEREF fields (tools/lib/gen-f7c.mjs), same run, strict
      - run: node --max-old-space-size=8192 crates/uo-docx-layout/tools/capture-layout.mjs --ts-root ../ts-main --mode ci --gen f7c --count 300 --seed ${{ github.run_number }} --out "$RUNNER_TEMP/layout/f7c.capture" --dump "$RUNNER_TEMP/layout/f7c-dump" --docs-out "$RUNNER_TEMP/layout/f7c-docs"
      - run: cargo test --release -p uo-docx-layout --test layout_parity -- --nocapture
        env:
          UO_LAYOUT_PARITY: "1"
          UO_LAYOUT_STRICT: "1"
          UO_LAYOUT_CAPTURE: ${{ runner.temp }}/layout/f7c.capture
          UO_LAYOUT_DUMP: ${{ runner.temp }}/layout/f7c-dump
          UO_LAYOUT_DOCS: ${{ runner.temp }}/layout/f7c-docs
      # F7b (tables and floats): tables, floating tables, floating shapes/textboxes, inline shapes
      # and frames (tools/lib/gen-f7b.mjs), same run, strict
      - run: node --max-old-space-size=8192 crates/uo-docx-layout/tools/capture-layout.mjs --ts-root ../ts-main --mode ci --gen f7b --count 200 --seed ${{ github.run_number }} --out "$RUNNER_TEMP/layout/f7b.capture" --dump "$RUNNER_TEMP/layout/f7b-dump" --docs-out "$RUNNER_TEMP/layout/f7b-docs"
      - run: cargo test --release -p uo-docx-layout --test layout_parity -- --nocapture
        env:
          UO_LAYOUT_PARITY: "1"
          UO_LAYOUT_STRICT: "1"
          UO_LAYOUT_CAPTURE: ${{ runner.temp }}/layout/f7b.capture
          UO_LAYOUT_DUMP: ${{ runner.temp }}/layout/f7b-dump
          UO_LAYOUT_DOCS: ${{ runner.temp }}/layout/f7b-docs
      # F7d (linked textbox chains, endnote-flow tables): chains of floating, inline and grouped
      # boxes cut in paragraphs and between table rows, endnotes with tables (tools/lib/gen-f7d.mjs),
      # same run, strict
      - run: node --max-old-space-size=8192 crates/uo-docx-layout/tools/capture-layout.mjs --ts-root ../ts-main --mode ci --gen f7d --count 200 --seed ${{ github.run_number }} --out "$RUNNER_TEMP/layout/f7d.capture" --dump "$RUNNER_TEMP/layout/f7d-dump" --docs-out "$RUNNER_TEMP/layout/f7d-docs"
      - run: cargo test --release -p uo-docx-layout --test layout_parity -- --nocapture
        env:
          UO_LAYOUT_PARITY: "1"
          UO_LAYOUT_STRICT: "1"
          UO_LAYOUT_CAPTURE: ${{ runner.temp }}/layout/f7d.capture
          UO_LAYOUT_DUMP: ${{ runner.temp }}/layout/f7d-dump
          UO_LAYOUT_DOCS: ${{ runner.temp }}/layout/f7d-docs
      # F8 (the editor-facing API and the oracle): the P4 facets (tools/lib/facets-f8.mjs) over
      # F7c/F7b documents with links and plugin inlines (`--gen f8`), same run
      - run: node --max-old-space-size=8192 crates/uo-docx-layout/tools/capture-layout.mjs --ts-root ../ts-main --mode ci --gen f8 --f8 --count 200 --seed ${{ github.run_number }} --out "$RUNNER_TEMP/layout/f8.capture" --dump "$RUNNER_TEMP/layout/f8-dump" --docs-out "$RUNNER_TEMP/layout/f8-docs"
      - run: cargo test --release -p uo-docx-layout --test f8_parity -- --nocapture
        env:
          UO_F8_PARITY: "1"
          UO_LAYOUT_CAPTURE: ${{ runner.temp }}/layout/f8.capture
          UO_LAYOUT_DUMP: ${{ runner.temp }}/layout/f8-dump
          UO_LAYOUT_DOCS: ${{ runner.temp }}/layout/f8-docs
      # G8 (the Write section of the page message, record "Write page section (G8)"): the g8.* facets
      # of F7c/F7b documents (separate capture: the other replays do not know the facets), replayed
      # from the same dumps
      - run: node --max-old-space-size=8192 crates/uo-docx-layout/tools/capture-layout.mjs --ts-root ../ts-main --mode ci --gen f8 --f8 --g8 --count 100 --seed ${{ github.run_number }} --out "$RUNNER_TEMP/layout/g8.capture" --dump "$RUNNER_TEMP/layout/g8-dump" --docs-out "$RUNNER_TEMP/layout/g8-docs"
      - run: cargo test --release -p uo-docx-layout --test g8 -- --nocapture
        env:
          UO_G8_PARITY: "1"
          UO_LAYOUT_CAPTURE: ${{ runner.temp }}/layout/g8.capture
          UO_LAYOUT_DUMP: ${{ runner.temp }}/layout/g8-dump
          UO_LAYOUT_DOCS: ${{ runner.temp }}/layout/g8-docs
      # F1 (fonts and the width model): the P3 facets of the same capture, replayed from their dumped
      # inputs, plus a resolver sweep (the Word substitution chain over random font tables)
      - run: node crates/uo-docx-layout/tools/capture-f1-resolver.mjs --ts-root ../ts-main --count 2000 --seed ${{ github.run_number }} --out "$RUNNER_TEMP/layout/resolver.capture" --dump "$RUNNER_TEMP/layout/resolver"
      - run: cargo test --release -p uo-docx-layout --test f1_parity -- --nocapture
        env:
          UO_LAYOUT_CAPTURE: ${{ runner.temp }}/layout/ci.capture
          UO_LAYOUT_DUMP: ${{ runner.temp }}/layout/dump
          UO_F1_RESOLVER_CAPTURE: ${{ runner.temp }}/layout/resolver.capture
          UO_F1_RESOLVER_DUMP: ${{ runner.temp }}/layout/resolver
      # F5 (lines and paint): p3.lines and p3.paint of the same capture, replayed call by call from
      # the dumped inputs (`<key>.f5.bin`)
      - run: cargo test --release -p uo-docx-layout --test f5_parity -- --nocapture
        env:
          UO_F5_CAPTURE: ${{ runner.temp }}/layout/ci.capture
          UO_F5_DUMP: ${{ runner.temp }}/layout/dump

  server-pdf:
    name: Server PDF (uo-ffi, frontier S; the 68 fixture documents equal the TS renderPdf byte for byte, release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      # tests/server_parity.rs over every fixture document (the debug test job samples every 7th); ffi_memory: M1, M3, M4, the thread soak
      - run: cargo test -p uo-ffi --release --all-features -- --nocapture
        env:
          UO_SERVER_PARITY_EVERY: '1'
          UO_FFI_SOAK: '25'
      # G4 in release: the cancellation of the layout inside the engine (bound 250 ms here, 2 s in the debug test job). The uo-ffi
      # cancel_layout test (G4 through the C ABI, bound 50 ms in release) is already in the `-p uo-ffi --release --all-features` line above
      - run: cargo test -p uo-docx-layout --release --test g4_cancel -- --nocapture
      # LA7 (the incremental relayout of the editor session: equal to a full layout, bounded by the soak) in release with the
      # full bounds; the debug test job runs the reduced ones. The same release build of uo-docx-layout as g4_cancel above
      - run: cargo test -p uo-docx-layout --release --test la7 -- --nocapture
      # the editing_* tests of uo-ffi (the Editing API through the C ABI: editing_abi, editing_memory, editing_nopanic) run in the
      # `-p uo-ffi --release --all-features` line above and in the debug `test` job: editing-api is not a feature of uo-ffi, it is
      # always on through the uo-docx dependency, so there is no `--features editing-api` line

  soak:
    name: Memory soaks (M2, 1,000 iterations, release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      # uo-opc: open → parse → edit → save → reopen, 1,000 times, live bytes flat (#[ignore]d in
      # the test job: about 190 s in debug)
      - run: cargo test -p uo-opc --release --all-features --test package_soak -- --ignored m2_soak_1000 --nocapture
      # the session in wasm, native half (milestone 2): the editor session through every export, M1 (live bytes back), M3
      # (bytes and time per key), the 1,000-session soak, the hostile bytes, the random Exec/Query messages of the generated support
      # (3,000 each, twice: leaks) and the stale layouts; the debug test job runs the same with the default bounds
      - run: cargo test -p uo-wasm --release --features session,count,session-selftest --test session_native -- --nocapture --test-threads=2

  jsnum:
    name: uo-jsnum parity (10^7 samples per distribution, release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      # tests/captures/jsnum.capture is Node 24.15.0 x64 (Windows or Linux: the fdlibm bits are the
      # same); the M2 soak of the crate is the ignored m2_soak_1000
      - run: cargo test -p uo-jsnum --release --all-features -- --include-ignored

  deny:
    name: Dependency bans and licences (cargo deny, third-party notices)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: rustup toolchain install stable --profile minimal -t wasm32-unknown-unknown && rustup default stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      # libm and num-traits would bring non-JS float math back; every linked crate is under the [licenses] allow list (deny.toml)
      - run: cargo deny check bans licenses
      # core/licenses (the third-party notices that ship inside the npm products and the NuGet) equals what cargo tree says is
      # linked into the write wasm (viewer module), the editor wasm (session module) and uo_ffi; a new or bumped crate without
      # regenerating them fails here
      - run: node tools/licenses/gen-notices.mjs --check

  audit:
    name: Advisories (cargo audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # the workspace and the fuzz crate (its own lock file)
      - run: cargo audit
      - run: cargo audit --file fuzz/Cargo.lock

  wasm:
    name: WebAssembly (build, Safari 15 features, boundary memory M2/M4, uo-opc M2, uo-fonts, uo-drawingml, WebKit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: rustup toolchain install stable --profile minimal -t wasm32-unknown-unknown && rustup default stable
      # opc-memtest: the test-only export of the uo-opc round trip (soak in wasm, M2)
      - run: cargo build -p uo-wasm --features count,opc-memtest --target wasm32-unknown-unknown --profile wasm
      - run: node --expose-gc --test crates/uo-wasm/tests/boundary.test.mjs
      - run: node --test crates/uo-wasm/tests/opc_memory.test.mjs
      # fonts-memtest: the uo-fonts soaks and worst-case fonts in wasm (stage 4, M2); 300 rounds here, the native soak runs 1,000
      - run: cargo build -p uo-wasm --features fonts-memtest --target wasm32-unknown-unknown --profile wasm
      - run: UO_FONTS_SOAK=300 node --test crates/uo-wasm/tests/fonts_memory.test.mjs
      # fonts-selftest: the uo-fonts parity replay (fonts.cap, legacy_kern.cap) recomputed inside the module (stage 4, parity)
      - run: cargo build -p uo-wasm --features fonts-selftest --target wasm32-unknown-unknown --profile wasm
      - run: node --test crates/uo-wasm/tests/fonts_selftest.test.mjs
      # dml-memtest: the uo-drawingml soak (M2, 200 rounds: live bytes flat, memory.buffer.byteLength stops growing), the big
      # effects at 1 and 4 Mpx against the M3 budgets and the 128 MiB phone budget, the wasm32 limit rows, the worst case per limit
      - run: cargo build -p uo-wasm --features dml-memtest --target wasm32-unknown-unknown --profile wasm
      - run: UO_DML_SOAK=200 node --test crates/uo-wasm/tests/dml_memory.test.mjs
      # dml-selftest: the uo-drawingml parity replay (the four committed captures, 20 groups) recomputed inside the module; the whole corpus here
      - run: cargo build -p uo-wasm --features dml-selftest --target wasm32-unknown-unknown --profile wasm
      - run: UO_DML_EVERY=1 node --test crates/uo-wasm/tests/dml_selftest.test.mjs
      # write: the Write read path of milestone 1 (uo-bindings.md): a viewer session over the fixture documents with the native
      # checksums pinned (wasm bytes = native bytes), errors, M4 (10,000 environments, documents and layouts through free() and the
      # FinalizationRegistry) and M2 (memory.buffer stops growing)
      # render-fixture adds the test-only render exports (the painter D/V tests below): one build runs every write and render test
      - run: cargo build -p uo-wasm --features count,write,render-fixture --target wasm32-unknown-unknown --profile wasm
      # S11: this module is a TEST build (count, render-fixture): build-pkg must refuse to ship it. `if`, not `! cmd`: under bash -e a
      # negated command never fails the step unless it is the last line
      # The negative asserts the refusal itself (the message "build de teste"), so a broken build-pkg cannot pass it vacuously
      - run: |
          if UO_WRITE_WASM="$PWD/target/wasm32-unknown-unknown/wasm/uo_wasm.wasm" node --input-type=module -e "const m = await import('../tools/build-pkg.mjs'); m.shipEngineWasm('write', process.env.RUNNER_TEMP + '/neg')" > "$RUNNER_TEMP/neg.log" 2>&1; then
            echo 'a test build was shipped'; exit 1
          fi
          grep -q 'build de teste' "$RUNNER_TEMP/neg.log" || { echo 'refused for another reason:'; cat "$RUNNER_TEMP/neg.log"; exit 1; }
      - run: node --expose-gc --test crates/uo-wasm/tests/write_api.test.mjs
      # G4: cancellation inside the layout (uo_host.layout_poll, WriteError code 10)
      - run: node --expose-gc --test crates/uo-wasm/tests/write_cancel.test.mjs
      # G8: the Write section of the page message (decoded in Node from the same module; imports .ts, so Node only)
      - run: node --test crates/uo-wasm/tests/write_section.test.mjs
      # gate fixes: nested tables / text boxes at max_nesting through the wasm layout, a full font ledger (M5, WriteError 5), and a
      # trap (the count build's uo_test_trap) that kills the viewer's instance: the next module gives the same PDF
      - run: node --expose-gc --test crates/uo-wasm/tests/write_hostile.test.mjs
      - run: node --expose-gc --test crates/uo-wasm/tests/viewer_trap.test.mjs
      # uo-render D and V (painter of decoded pages, milestone 1): the handle layer, the boundary, the TS codec of the render
      # messages, Part A of the painter parity (replay of tests/captures/v_paint.capture through the Rust painter: platform
      # independent since V-1; the "painter" job recaptures the frozen side on Linux and diffs it against this file) and the
      # painter's memory (M2/M4)
      - run: node --expose-gc --test crates/uo-wasm/tests/render_paint.test.mjs
      - run: node --expose-gc --test crates/uo-wasm/tests/render_boundary.test.mjs
      - run: node --expose-gc --test crates/uo-wasm/tests/render_ts_codec.test.mjs
      - run: node --expose-gc --test --test-concurrency=1 crates/uo-wasm/tests/paint_parity.test.mjs
      - run: node --expose-gc --test --test-concurrency=1 crates/uo-wasm/tests/paint_memory.test.mjs
      # the session in wasm (milestone 2, uo-bindings.md): the session exports through js/session.mjs. session-selftest adds the test-only
      # exports (random messages, the capture replay); count the memory counters of M2/M4
      - run: cargo build -p uo-wasm --features session,count,session-selftest --target wasm32-unknown-unknown --profile wasm
      # the API on three fixtures, errors, the protected session, the phase-1-survives-a-malformed-phase-2 assertion, stale layouts, M4 (10,000
      # sessions through free() and the FinalizationRegistry: live bytes back exactly) and M2 (flat)
      - run: node --expose-gc --test crates/uo-wasm/tests/session_api.test.mjs
        env:
          UO_WASM_PATH: ${{ github.workspace }}/core/target/wasm32-unknown-unknown/wasm/uo_wasm.wasm
      # hostile bytes, random Exec and Query messages: no trap, live bytes back after a second identical pass
      - run: node --expose-gc --test crates/uo-wasm/tests/session_hostile.test.mjs
        env:
          UO_WASM_PATH: ${{ github.workspace }}/core/target/wasm32-unknown-unknown/wasm/uo_wasm.wasm
          UO_WS_FUZZ_MS: '10000'
      # the committed session captures replayed through the production open and the exports (the families listed; UO_WS_FAMILIES)
      - run: node --test crates/uo-wasm/tests/session_replay.test.mjs
        env:
          UO_WASM_PATH: ${{ github.workspace }}/core/target/wasm32-unknown-unknown/wasm/uo_wasm.wasm
          UO_WS_FAMILIES: 'd2a,f1,f2,f3,f5,f6,f7,f8,f9,f10'
      # the browser runner's shims (Buffer subset, SHA-256) equal node:buffer and node:crypto
      - run: node --test crates/uo-wasm/tests/browser/shims.test.mjs
      # browser baseline Safari 15 / iOS 15 (rust-port skill): the module may use only the
      # features Safari 15 has; the negative case proves the feature list rejects SIMD
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools
      - name: Wasm features within Safari 15
        run: |
          features=-all,wasm1,mutable-global,saturating-float-to-int,sign-extension,reference-types,multi-value,bulk-memory
          cargo build -p uo-wasm --target wasm32-unknown-unknown --profile wasm
          wasm-tools validate --features "$features" target/wasm32-unknown-unknown/wasm/uo_wasm.wasm
          # the module of the viewer (render + write, with its uo_host.pdf_chunk import)
          cargo build -p uo-wasm --features write --target wasm32-unknown-unknown --profile wasm
          wasm-tools validate --features "$features" target/wasm32-unknown-unknown/wasm/uo_wasm.wasm
          echo "write module: $(stat -c %s target/wasm32-unknown-unknown/wasm/uo_wasm.wasm) bytes"
          # shipping: build-pkg copies this module into the write and document-viewer packages and fails without the current
          # third-party notices (core/licenses)
          UO_WRITE_WASM="$PWD/target/wasm32-unknown-unknown/wasm/uo_wasm.wasm" node --input-type=module -e "const m = await import('../tools/build-pkg.mjs'); if (!m.shipEngineWasm('write', process.env.RUNNER_TEMP + '/pkg')) process.exit(1)"
          test -f "$RUNNER_TEMP/pkg/licenses/uo-write-wasm/THIRD-PARTY-NOTICES.md"
          # (after the shipping lines above, which copy the `--features write` module)
          # the shipped session module (the Write editor's engine of milestone 2; without the count and self-test features)
          cargo build -p uo-wasm --features session --target wasm32-unknown-unknown --profile wasm
          wasm-tools validate --features "$features" target/wasm32-unknown-unknown/wasm/uo_wasm.wasm
          echo "session module: $(stat -c %s target/wasm32-unknown-unknown/wasm/uo_wasm.wasm) bytes"
          # shipping of the editor module: chunks/uo-write-editor.wasm of the write package (content-checked: no test exports, no count)
          cp target/wasm32-unknown-unknown/wasm/uo_wasm.wasm "$RUNNER_TEMP/uo-write-editor.wasm"
          UO_WRITE_EDITOR_WASM="$RUNNER_TEMP/uo-write-editor.wasm" node --input-type=module -e "const m = await import('../tools/build-pkg.mjs'); if (!m.shipEngineWasm('write', process.env.RUNNER_TEMP + '/pkg', 'editor')) process.exit(1)"
          test -f "$RUNNER_TEMP/pkg/chunks/uo-write-editor.wasm"
          echo '(module (func (drop (v128.const i32x4 0 0 0 0))))' | wasm-tools parse -o /tmp/simd.wasm
          ! wasm-tools validate --features "$features" /tmp/simd.wasm
      # the same tests inside WebKit, the engine of Safari
      - name: Wasm tests in WebKit
        run: |
          cargo build -p uo-wasm --features count,opc-memtest --target wasm32-unknown-unknown --profile wasm
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.61.0
          npx --prefix "$RUNNER_TEMP/pw" playwright install --with-deps webkit
          UO_PLAYWRIGHT="$RUNNER_TEMP/pw/node_modules/playwright" node crates/uo-wasm/tests/browser/run.mjs --browser webkit
          cargo build -p uo-wasm --features fonts-memtest --target wasm32-unknown-unknown --profile wasm
          UO_FONTS_SOAK=300 UO_PLAYWRIGHT="$RUNNER_TEMP/pw/node_modules/playwright" node crates/uo-wasm/tests/browser/run.mjs --browser webkit crates/uo-wasm/tests/fonts_memory.test.mjs
          cargo build -p uo-wasm --features fonts-selftest --target wasm32-unknown-unknown --profile wasm
          UO_PLAYWRIGHT="$RUNNER_TEMP/pw/node_modules/playwright" node crates/uo-wasm/tests/browser/run.mjs --browser webkit crates/uo-wasm/tests/fonts_selftest.test.mjs
          cargo build -p uo-wasm --features dml-memtest --target wasm32-unknown-unknown --profile wasm
          UO_DML_SOAK=100 UO_PLAYWRIGHT="$RUNNER_TEMP/pw/node_modules/playwright" node crates/uo-wasm/tests/browser/run.mjs --browser webkit crates/uo-wasm/tests/dml_memory.test.mjs
          cargo build -p uo-wasm --features dml-selftest --target wasm32-unknown-unknown --profile wasm
          UO_PLAYWRIGHT="$RUNNER_TEMP/pw/node_modules/playwright" node crates/uo-wasm/tests/browser/run.mjs --browser webkit crates/uo-wasm/tests/dml_selftest.test.mjs
          cargo build -p uo-wasm --features count,write,render-fixture --target wasm32-unknown-unknown --profile wasm
          UO_PLAYWRIGHT="$RUNNER_TEMP/pw/node_modules/playwright" node crates/uo-wasm/tests/browser/run.mjs --browser webkit crates/uo-wasm/tests/write_api.test.mjs
          # the painter in WebKit: the handle layer, the boundary and Part A of the painter parity (record "Milestone 1 - Shipping, CI and WebKit")
          UO_PLAYWRIGHT="$RUNNER_TEMP/pw/node_modules/playwright" node crates/uo-wasm/tests/browser/run.mjs --browser webkit crates/uo-wasm/tests/render_paint.test.mjs crates/uo-wasm/tests/render_boundary.test.mjs crates/uo-wasm/tests/write_section.test.mjs crates/uo-wasm/tests/paint_parity.test.mjs

  painter:
    name: Painter parity (uo-render V, frozen side recaptured in the same run, Parts B/C, Chromium and WebKit pixels)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # the frozen TS engine (main) is the reference: built in the same run, as in layout-parity
      - uses: actions/checkout@v7
        with:
          # pinned to the frozen TS commit (the parity reference): main moves on and its dist was stale (F2-20)
          ref: d0f45bc54c05fb026475d7b229efa498af8423c6
          path: ts-main
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15
      - run: rustup toolchain install stable --profile minimal -t wasm32-unknown-unknown && rustup default stable
      - name: Build the frozen TS engine
        working-directory: ts-main
        run: |
          npm run install:converter
          npm run install:fonts
          npm run install:drawingml
          npm install --prefix write
          npm run build -w @universal-office/docx-core --prefix write
          npm run build -w @universal-office/docx-layout --prefix write
      - run: cargo build -p uo-wasm --features count,write,render-fixture --target wasm32-unknown-unknown --profile wasm
      # V-1: the replay of Part A reads tests/captures/v_paint.capture (taken on Windows). The frozen painter recaptured here, on Linux
      # and Node 24.15, must equal it byte for byte except the @platform line: that is what makes Part A meaningful on every platform
      - name: Frozen side on Linux equals the committed capture (V-1)
        run: |
          mkdir -p "$RUNNER_TEMP/v"
          node --max-old-space-size=8192 crates/uo-render/tools/capture-v.mjs --ts-root ../ts-main --out-dir "$RUNNER_TEMP/v"
          diff <(grep -v '^@platform' crates/uo-render/tests/captures/v_paint.capture) <(grep -v '^@platform' "$RUNNER_TEMP/v/v_paint.capture")
      # Part A (replay), Part B (200 seeds locally, 50 here: generated pages through the frozen and the Rust painter, same run) and Part C
      - run: node --expose-gc --max-old-space-size=8192 --test --test-concurrency=1 crates/uo-wasm/tests/paint_parity.test.mjs
        env:
          UO_TS_ROOT: ${{ github.workspace }}/ts-main
          UO_WASM_PATH: ${{ github.workspace }}/core/target/wasm32-unknown-unknown/wasm/uo_wasm.wasm
          UO_V_SEEDS: '50'
      # pixels: the frozen and the Rust painter draw the same generated pages on a real canvas, in Chromium and in WebKit
      # (WebKit has no OffscreenCanvas on every platform: the painters then use an HTMLCanvasElement)
      - name: Pixels
        env:
          UO_TS_ROOT: ${{ github.workspace }}/ts-main
          UO_WASM_PATH: ${{ github.workspace }}/core/target/wasm32-unknown-unknown/wasm/uo_wasm.wasm
          UO_V_PIXEL_SEEDS: '30'
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.61.0
          npx --prefix "$RUNNER_TEMP/pw" playwright install --with-deps chromium webkit
          export UO_PLAYWRIGHT="$RUNNER_TEMP/pw/node_modules/playwright"
          node crates/uo-wasm/tests/browser/paint_pixels.mjs --browser chromium
          node crates/uo-wasm/tests/browser/paint_pixels.mjs --browser webkit

  viewer:
    name: Viewer TS/Rust switch (engine=rust - vitest with the wasm, Chromium parity, memory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: rustup toolchain install stable --profile minimal -t wasm32-unknown-unknown && rustup default stable
      # the products bundle the converter and the shared packages from source (as ci.yml)
      - name: Install
        working-directory: ${{ github.workspace }}
        run: |
          npm run install:converter
          npm run install:fonts
          npm run install:charts
          npm run install:drawingml
          npm run install:ui
          npm run install:spell
          npm install --prefix write
          npm install --prefix sheet
          npm install --prefix slides
      - name: Build
        working-directory: ${{ github.workspace }}
        run: npm run build
      # the viewer's wasm (`count` makes the memory phase count handles and live bytes)
      - run: cargo build -p uo-wasm --features count,write --target wasm32-unknown-unknown --profile wasm
      # engine-switch.test.ts: the viewer with engine="rust" against the TS engine over the fixtures (skipped without UO_WASM_PATH)
      - name: Viewer unit tests with the wasm
        working-directory: ${{ github.workspace }}/write/packages/viewer
        run: npx vitest run test/engine-switch.test.ts
        env:
          UO_WASM_PATH: ${{ github.workspace }}/core/target/wasm32-unknown-unknown/wasm/uo_wasm.wasm
      - name: Chromium for the switch runner
        working-directory: ${{ github.workspace }}
        run: npx --prefix sheet playwright install --with-deps chromium
      # viewer_switch.mjs in Chromium: phase 0 (the viewer without engine="rust" never requests the wasm), parity TS vs Rust over every
      # 6th fixture and the memory phase (50 rounds, flat memory, 0 handles). UO_TS_ROOT is this same checkout: the script takes only
      # tools from it (esbuild, playwright, the converter dist) and compares the two engines of the checkout. The frozen root and the
      # proprietary fonts are not needed: open fonts only.
      - run: node crates/uo-wasm/tests/browser/viewer_switch.mjs --mode all
        env:
          UO_TS_ROOT: ${{ github.workspace }}
          UO_WASM_PATH: ${{ github.workspace }}/core/target/wasm32-unknown-unknown/wasm/uo_wasm.wasm
          UO_SW_STRIDE: '6'
          UO_SW_SOAK: '50'
      # faults: a forced trap (the viewer drops the instance, the element reloads, a new element opens) and a refused font push
      # (OverBudget on the page environment: the document still loads with the substitute)
      - run: node crates/uo-wasm/tests/browser/viewer_switch.mjs --mode faults
        env:
          UO_TS_ROOT: ${{ github.workspace }}
          UO_WASM_PATH: ${{ github.workspace }}/core/target/wasm32-unknown-unknown/wasm/uo_wasm.wasm
          UO_SW_STRIDE: '6'

  editor:
    name: Editor TS/Rust switch (engine=rust - vitest, tsc, package build and smoke, Chromium harnesses)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: rustup toolchain install stable --profile minimal -t wasm32-unknown-unknown && rustup default stable
      # the products bundle the converter and the shared packages from source (as ci.yml)
      - name: Install
        working-directory: ${{ github.workspace }}
        run: |
          npm run install:converter
          npm run install:fonts
          npm run install:charts
          npm run install:drawingml
          npm run install:ui
          npm run install:spell
          npm install --prefix write
          npm install --prefix sheet
          npm install --prefix slides
      - name: Build
        working-directory: ${{ github.workspace }}
        run: npm run build
      # the editor and the viewer type-check (the harness writes the internal packages by source and runs the checkout's tsc; the same
      # command that core/target/m2-verify-d.sh runs), and the engine's declarations under the strictest flags (the codec job)
      - name: Editor and viewer tsc
        working-directory: ${{ github.workspace }}
        run: node core/crates/uo-wasm/tests/browser/editor_switch_tsc.mjs
        env:
          UO_TS_ROOT: ${{ github.workspace }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/es-target
      # the session wasm with the counting allocator (`count`; never shipped): the shell's unit tests and every harness below
      - run: cargo build -p uo-wasm --features session,count --target wasm32-unknown-unknown --profile wasm
      - run: cp target/wasm32-unknown-unknown/wasm/uo_wasm.wasm "$RUNNER_TEMP/session_count.wasm"
      # the editor's and the viewer's vitest through the harness config (the internal packages from source, the engine's JS side
      # aliased; skips the wasm tests without UO_WASM_PATH)
      - name: Editor unit tests
        working-directory: ${{ github.workspace }}/write/packages/editor
        run: node ../../node_modules/vitest/vitest.mjs run --config ${{ github.workspace }}/core/crates/uo-wasm/tests/browser/editor_switch_vitest.mjs
        env:
          UO_TS_ROOT: ${{ github.workspace }}
          UO_ES_PKG: editor
          UO_WASM_PATH: ${{ runner.temp }}/session_count.wasm
      - name: Viewer unit tests
        working-directory: ${{ github.workspace }}/write/packages/viewer
        run: node ../../node_modules/vitest/vitest.mjs run --config ${{ github.workspace }}/core/crates/uo-wasm/tests/browser/editor_switch_vitest.mjs
        env:
          UO_TS_ROOT: ${{ github.workspace }}
          UO_ES_PKG: viewer
          UO_WASM_PATH: ${{ runner.temp }}/session_count.wasm
      # the shell's API over the module (routes, handles, M4 through the FinalizationRegistry)
      - run: node --expose-gc --test crates/uo-wasm/tests/shell_api.test.mjs
        env:
          UO_WASM_PATH: ${{ runner.temp }}/session_count.wasm
          UO_ES_M4: '2000'
      # the package, end to end (wave 6, front P): the two shipped modules (never `count` or `selftest`: build-pkg refuses them by
      # content), then `build:pkg` of the editor package (the write package, with the viewer entry) and of document-viewer, with the
      # modules REQUIRED, the licence notices and the types
      - name: Package build
        run: |
          mkdir -p target/pkg-wasm
          cargo build -p uo-wasm --features write --target wasm32-unknown-unknown --profile wasm
          cp target/wasm32-unknown-unknown/wasm/uo_wasm.wasm target/pkg-wasm/uo-write.wasm
          cargo build -p uo-wasm --features session --target wasm32-unknown-unknown --profile wasm
          cp target/wasm32-unknown-unknown/wasm/uo_wasm.wasm target/pkg-wasm/uo-write-editor.wasm
          cd "$GITHUB_WORKSPACE"
          UO_WRITE_WASM="$PWD/core/target/pkg-wasm/uo-write.wasm" UO_WRITE_EDITOR_WASM="$PWD/core/target/pkg-wasm/uo-write-editor.wasm" \
            UO_REQUIRE_ENGINE_WASM=1 node tools/build-pkg.mjs font-files document-viewer write
          test -f write/packages/editor/publish/chunks/uo-write-editor.wasm
          test -f write/packages/editor/publish/chunks/uo-write.wasm
          test "$(ls write/packages/viewer/publish/chunks/*.wasm | wc -l)" = 1
          test -f write/packages/editor/publish/licenses/uo-write-wasm/THIRD-PARTY-NOTICES.md
          grep -q 'class UniversalWriteElement' write/packages/editor/publish/index.d.ts
          grep -q 'class UniversalDocumentViewerElement' write/packages/editor/publish/viewer.d.ts
          ls -l write/packages/editor/publish/chunks/*.wasm
      - name: Chromium for the runners
        working-directory: ${{ github.workspace }}
        run: npx --prefix sheet playwright install --with-deps chromium
      # the published package in Chromium: the default engine fetches no .wasm, the editor's module serves a viewer loaded after it,
      # a viewer loaded first makes the rust editor refuse (the module order rule)
      - run: node crates/uo-wasm/tests/browser/pkg_smoke.mjs
        env:
          UO_TS_ROOT: ${{ github.workspace }}
      # editor_switch.mjs in Chromium: phase 0 (an editor without engine="rust" never requests the wasm), parity TS vs Rust over every
      # 6th fixture with scripted real input, the memory phase, the keys and the chrome. UO_TS_ROOT is this same checkout: the script
      # takes only tools from it. Open fonts only (the DECLARED tables were measured on Windows; the first runs here are the Linux measure).
      - run: node crates/uo-wasm/tests/browser/editor_switch.mjs --mode all
        env:
          UO_TS_ROOT: ${{ github.workspace }}
          UO_WASM_PATH: ${{ runner.temp }}/session_count.wasm
          UO_ES_STRIDE: '6'
          UO_ES_SOAK: '50'
      # the three front harnesses (stories, objects, review): longer (about 13 minutes together), so not on every push
      - name: Stories, text boxes and notes harness
        if: github.event_name != 'push'
        run: node crates/uo-wasm/tests/browser/editor_switch_stories.mjs --mode all
        env:
          UO_TS_ROOT: ${{ github.workspace }}
          UO_WASM_PATH: ${{ runner.temp }}/session_count.wasm
          UO_ES_SOAK: '50'
      - name: Objects harness
        if: github.event_name != 'push'
        run: node crates/uo-wasm/tests/browser/editor_switch_objects.mjs --mode all
        env:
          UO_TS_ROOT: ${{ github.workspace }}
          UO_WASM_PATH: ${{ runner.temp }}/session_count.wasm
          UO_EO_SOAK: '30'
      - name: Review harness
        if: github.event_name != 'push'
        run: node crates/uo-wasm/tests/browser/editor_switch_review.mjs --mode all
        env:
          UO_TS_ROOT: ${{ github.workspace }}
          UO_WASM_PATH: ${{ runner.temp }}/session_count.wasm
          UO_ER_SOAK: '50'

  dotnet:
    name: .NET facade (server PDF parity, Editing API, frozen suite, D3 parity, boundary memory M4, thread soak) (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      # the facade over uo-ffi (uo-bindings.md): the fixture PDFs equal the TS renderPdf and the Rust native bytes, M4 through
      # Dispose() and the finalizer, 8 threads converting at once; EXTRA_FONT_DIRS gives the system index the open fonts
      - run: dotnet test dotnet/UniversalOffice.Docx.Tests -m:2
        env:
          EXTRA_FONT_DIRS: ${{ github.workspace }}/shared/fonts/files
      - run: dotnet run --project dotnet/UniversalOffice.Docx.Smoke -- crates/uo-docx-layout/tests/captures/f8/docs/f8__7__1.docx "$RUNNER_TEMP/smoke.pdf" --font-dir ../shared/fonts/files --font-dir ../site/assets/fonts
      # the Editing API of uo-docx D3 through the facade (uo-docx-d3.md section 4): the FROZEN C# Editing test suite, linked, over the Rust core
      - run: dotnet test dotnet/UniversalOffice.Docx.FrozenSuite -m:2
      # the D3 differential harness through the facade: the 18 scripts over the corpus and the .NET-semantics sites equal the frozen C# captures
      - run: dotnet run -c Release --project dotnet/UniversalOffice.Docx.Parity -- corpus-check crates/uo-docx/tests/parity/d3/corpus.capture .. crates/uo-docx/tests/parity/d3/corpus.list "$RUNNER_TEMP/facade-corpus.capture"
      - run: dotnet run -c Release --project dotnet/UniversalOffice.Docx.Parity -- semantics-check crates/uo-docx/tests/parity/d3/semantics.capture crates/uo-docx/tests/parity/custom-tag.inputs.txt "$RUNNER_TEMP/facade-semantics.capture"
      - run: dotnet run --project dotnet/UniversalOffice.Docx.Smoke -- edit crates/uo-docx/tests/parity/d3/fixtures/inlines.docx crates/uo-docx/tests/parity/d3/fixtures/sample-template.docx "$RUNNER_TEMP/smoke-edit.docx"

  miri:
    name: Miri (unsafe code, M6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install nightly --profile minimal -c miri,rust-src && rustup default nightly
      - run: cargo miri setup
      # every crate with unsafe code goes here as it arrives
      - run: cargo miri test -p uo-alloc --features global
      - run: cargo miri test -p uo-ffi --lib
      - run: cargo miri test -p uo-wasm
      - run: cargo miri test -p uo-wasm --features write --test write_unsafe
      - run: cargo miri test -p uo-wasm --features render-fixture --test render_unsafe

  leak-sanitizer:
    name: LeakSanitizer (M6)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -Zsanitizer=leak
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install nightly --profile minimal && rustup default nightly
      - run: cargo test --workspace --all-features --target x86_64-unknown-linux-gnu

  # G19 (wave 7, B): the C# facade's tests over a uo-ffi built with LeakSanitizer. The runtime is preloaded into `dotnet`
  # (the library is loaded by the CLR, not linked into the host); the CLR's own allocations at exit are suppressed by
  # module (`leak:libcoreclr.so` …), so a report names a leak whose stack runs through libuo_ffi.so. Never run yet (G30-CI).
  leak-sanitizer-facade:
    name: LeakSanitizer over the .NET facade (G19)
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ runner.temp }}/lsan
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: rustup toolchain install nightly --profile minimal && rustup default nightly
      - name: uo-ffi with LeakSanitizer
        working-directory: core
        env:
          RUSTFLAGS: -Zsanitizer=leak
        run: |
          set -euo pipefail
          cargo build -p uo-ffi --release --features count --target x86_64-unknown-linux-gnu
          mkdir -p "$CARGO_TARGET_DIR/release"
          cp "$CARGO_TARGET_DIR/x86_64-unknown-linux-gnu/release/libuo_ffi.so" "$CARGO_TARGET_DIR/release/"
          printf 'leak:libcoreclr.so\nleak:libclrjit.so\nleak:libhostfxr.so\nleak:libhostpolicy.so\nleak:libSystem.Native.so\nleak:libSystem.Security.Cryptography.Native.OpenSsl.so\nleak:libicu\n' > "$RUNNER_TEMP/lsan.supp"
          echo "LSAN_RT=$(rustc --print sysroot)/lib/rustlib/x86_64-unknown-linux-gnu/lib/librustc-nightly_rt.lsan.so" >> "$GITHUB_ENV"
      - name: facade tests under LeakSanitizer
        working-directory: core
        run: |
          set -euo pipefail
          dotnet build dotnet/UniversalOffice.Docx.Tests -p:UoSkipCargo=true
          LD_PRELOAD="$LSAN_RT" LSAN_OPTIONS="suppressions=$RUNNER_TEMP/lsan.supp:print_suppressions=0" \
            dotnet test dotnet/UniversalOffice.Docx.Tests --no-build -m:1
        env:
          EXTRA_FONT_DIRS: ${{ github.workspace }}/shared/fonts/files

  fuzz:
    name: Fuzz (uo-opc, uo-jsnum, uo-fonts, uo-drawingml, uo-codec, libFuzzer)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/fuzz
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install nightly --profile minimal && rustup default nightly
      - run: cargo install cargo-fuzz --locked
      # seed corpora from the repository's documents and open fonts (corpus/ is not versioned)
      - run: cargo run --release --no-default-features --features fallback --bin seed
      - run: cargo fuzz build
      # a short budget per target on every push (every file of fuzz_targets: the uo-opc targets,
      # jsnum_parse, jsnum_math, numfmt_format, the 17 fonts_* targets, the 12 dml_* targets and codec_decode, codec_roundtrip); long runs are
      # local (module records, "Security" and "Continuous verification")
      - run: |
          for t in $(ls fuzz_targets | sed 's/\.rs$//'); do
            echo "::group::$t"
            cargo fuzz run "$t" -- -max_total_time=60 -timeout=10 -rss_limit_mb=2048 -print_final_stats=1 || exit 1
            echo "::endgroup::"
          done
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts
          path: core/fuzz/artifacts
